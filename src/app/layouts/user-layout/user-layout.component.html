<div class="user-wrapper d-flex flex-column min-vh-100">
  <mat-toolbar color="primary" class="premium-header">
    <div class="container d-flex justify-content-between align-items-center w-100">
      <a routerLink="/home" class="navbar-brand d-flex align-items-center text-white text-decoration-none">
        <mat-icon class="me-2">directions_bus</mat-icon>
        <span class="fs-4 fw-bold">BusBooking</span>
      </a>

      <div class="nav-links d-none d-md-flex">
        <a mat-button routerLink="/home" routerLinkActive="active-link" class="text-white">Home</a>
        <a mat-button routerLink="/profile/bookings" routerLinkActive="active-link" class="text-white">My Bookings</a>
      </div>

      <div class="auth-buttons">
        <a mat-stroked-button color="accent" routerLink="/auth/login" class="me-2">Login</a>
        <a mat-flat-button color="accent" routerLink="/auth/register">Sign Up</a>
      </div>
    </div>
  </mat-toolbar>
  
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container d-flex justify-content-between align-items-center flex-column flex-md-row">
      <p class="mb-0">&copy; 2024 Bus Booking System. All rights reserved.</p>
      <div class="footer-links mt-3 mt-md-0">
        <a href="#" class="text-white text-decoration-none me-3">Privacy Policy</a>
        <a href="#" class="text-white text-decoration-none">Terms of Service</a>
      </div>
    </div>
  </footer>
</div>
