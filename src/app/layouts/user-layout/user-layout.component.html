<div class="user-wrapper d-flex flex-column min-vh-100">
  <mat-toolbar color="primary" class="premium-header">
    <div class="container d-flex justify-content-between align-items-center w-100">
      <a routerLink="/home" class="navbar-brand d-flex align-items-center text-white text-decoration-none">
        <mat-icon class="me-2 text-warning fs-3">directions_bus</mat-icon>
        <span class="fs-4 fw-bold logo-text">BusBooking</span>
      </a>

      <div class="nav-links d-none d-md-flex align-items-center">
        <a mat-button routerLink="/home" routerLinkActive="active-link" class="nav-btn">Home</a>
        <a mat-button routerLink="/search" routerLinkActive="active-link" class="nav-btn">Find Buses</a>
        <a mat-button routerLink="/booking/my-bookings" routerLinkActive="active-link" class="nav-btn" *ngIf="isLoggedIn">My Bookings</a>
      </div>

      <div class="auth-buttons d-flex align-items-center">
        <ng-container *ngIf="!isLoggedIn; else userProfileMenu">
          <a mat-stroked-button color="accent" routerLink="/auth/login" class="me-2 login-btn">Login</a>
          <a mat-flat-button color="accent" routerLink="/auth/register" class="signup-btn">Sign Up</a>
        </ng-container>

        <ng-template #userProfileMenu>
          <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn d-flex align-items-center">
            <mat-icon class="me-1 icon-user">account_circle</mat-icon>
            <span class="username-text me-1">{{ getUserDisplayName() }}</span>
            <mat-icon class="dropdown-icon">expand_more</mat-icon>
          </button>
          
          <mat-menu #userMenu="matMenu" class="custom-user-menu">
            <div class="px-3 py-2 border-bottom user-menu-header">
              <p class="mb-0 fw-bold text-dark">{{ getUserDisplayName() }}</p>
              <small class="text-muted">{{ currentUser?.sub || currentUser?.email }}</small>
            </div>
            <a mat-menu-item routerLink="/home">
              <mat-icon>home</mat-icon>
              <span>Home</span>
            </a>
            <a mat-menu-item routerLink="/booking/my-bookings">
              <mat-icon>confirmation_number</mat-icon>
              <span>My Bookings</span>
            </a>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()" class="text-danger">
              <mat-icon class="text-danger">exit_to_app</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </ng-template>
      </div>
    </div>
  </mat-toolbar>
  
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container d-flex justify-content-between align-items-center flex-column flex-md-row">
      <p class="mb-0">&copy; 2024 Bus Booking System. All rights reserved.</p>
      <div class="footer-links mt-3 mt-md-0">
        <a href="#" class="text-white text-decoration-none me-3">Privacy Policy</a>
        <a href="#" class="text-white text-decoration-none">Terms of Service</a>
      </div>
    </div>
  </footer>
</div>
